import org.gradle.api.artifacts.dsl.LockMode

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.2.21'
    }
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    configurations.configureEach {
        exclude group: "com.google.guava", module: "listenablefuture"
    }

    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
    }
}

tasks.register("resolveAndLockAll") {
    description = "Resolve every resolvable project configuration and persist reviewed dependency locks."
    group = "build setup"
    dependsOn subprojects.collect { "${it.path}:dependencies" }
    doFirst {
        if (!gradle.startParameter.writeDependencyLocks) {
            throw new GradleException("resolveAndLockAll must be run with --write-locks")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
