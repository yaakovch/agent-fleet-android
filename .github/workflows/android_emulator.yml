name: Android emulator verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-36:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager "platform-tools" "platforms;android-36" "system-images;android-36;google_apis;x86_64"
      - name: JVM tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Pixel 7 API 36 suite
        run: ./gradlew :app:agentFleetPixel7Api36DebugAndroidTest --no-daemon --console=plain
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-reports
          if-no-files-found: warn
          path: |
            app/build/reports/tests
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
