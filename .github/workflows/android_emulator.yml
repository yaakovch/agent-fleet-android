name: Android emulator verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-36:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      AGENT_FLEET_EMULATOR_BACKEND: managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/agent-fleet-main' }}
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager \
            "build-tools;36.0.0" \
            "ndk;22.1.7171670" \
            "platform-tools" \
            "platforms;android-36" \
            "system-images;android-36;google_apis;x86_64"
      - name: Run the canonical local-equals-CI gate
        run: bash scripts/quality-gate.sh full
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-reports
          if-no-files-found: warn
          path: |
            build/reports/agent-fleet
            app/build/reports/tests
            app/build/reports/lint-results-debug.*
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
