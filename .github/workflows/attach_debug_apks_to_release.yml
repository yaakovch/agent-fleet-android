name: Attach Debug APKs To Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  attach-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install the pinned Android build inputs
        run: |
          sdkmanager \
            "build-tools;36.0.0" \
            "ndk;22.1.7171670" \
            "platform-tools" \
            "platforms;android-36"

      - name: Build and attach APKs to release
        shell: bash {0}
        run: |
          set -euo pipefail

          fail() {
              echo "$1" >&2
              exit 1
          }

          echo "Setting vars"
          RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           fail "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi
          TRACKED_VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' ./app/version.properties)"
          if [[ "$RELEASE_VERSION_NAME" != "v$TRACKED_VERSION_NAME" ]]; then
            fail "Release tag '$RELEASE_VERSION_NAME' does not match tracked app version 'v$TRACKED_VERSION_NAME'."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME+github-debug"
          APK_BASENAME_PREFIX="agent-fleet_$APK_VERSION_TAG"

          echo "Building APKs for '$RELEASE_VERSION_NAME' release"
          export TERMUX_APP_VERSION_NAME="$TRACKED_VERSION_NAME"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          if ! bash scripts/quality-gate.sh package; then
            fail "Build failed for '$RELEASE_VERSION_NAME' release."
          fi

          echo "Validating APKs"
          for abi in universal arm64-v8a x86_64; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              fail "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            fail "Generate sha256sums failed for '$RELEASE_VERSION_NAME' release."
          fi

          echo "Attaching APKs to github release"
          if ! gh release upload "$RELEASE_VERSION_NAME" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86_64.apk" \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums" \
          ; then
            fail "Attach APKs to release failed for '$RELEASE_VERSION_NAME' release."
          fi
