        implementation "androidx.drawerlayout:drawerlayout:1.1.1"
        implementation "androidx.preference:preference:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "androidx.activity:activity-compose:1.7.2"
        implementation "androidx.compose.foundation:foundation:1.5.4"
        implementation "androidx.compose.material3:material3:1.1.2"
        implementation "androidx.compose.ui:ui:1.5.4"
        implementation "androidx.compose.ui:ui-tooling-preview:1.5.4"
        debugImplementation "androidx.compose.ui:ui-tooling:1.5.4"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "com.termux"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 1041
        versionName "0.118.4-agentfleet.39"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"

        if (appVersionName) versionName = appVersionName
        if (appVersionCode) versionCode = appVersionCode.toInteger()
        validateVersionName(versionName)

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('dev_keystore.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.8"
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lintOptions {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        managedDevices {
            devices {
                agentFleetPixel7Api36(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = "Pixel 7"
                    apiLevel = 36
                    systemImageSource = "google"
                }
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main.assets.srcDir "$buildDir/generated/agentFleetAssets"
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

}

def agentFleetRuntimeSource = file("src/main/agent-fleet")
def agentFleetGeneratedAssets = file("$buildDir/generated/agentFleetAssets/agent-fleet")
def agentFleetPackageCache = new File(gradle.gradleUserHomeDir, "caches/agent-fleet-termux-packages/aarch64")

def fileSha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    input.withInputStream { stream ->
        def buffer = new byte[1024 * 1024]
        while (true) {
            def count = stream.read(buffer)
            if (count < 0) break
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

task prepareAgentFleetRuntimeAssets {
    inputs.dir(agentFleetRuntimeSource)
    outputs.dir(agentFleetGeneratedAssets)
    doLast {
        def descriptorFile = new File(agentFleetRuntimeSource, "embedded-runtime-v1.json")
        def lockFile = new File(agentFleetRuntimeSource, "termux-packages-aarch64.json")
        if (!descriptorFile.isFile() || !lockFile.isFile()) {
            throw new GradleException("Agent Fleet embedded runtime descriptor or package lock is missing")
        }
        def descriptor = new groovy.json.JsonSlurper().parse(descriptorFile)
        def lock = new groovy.json.JsonSlurper().parse(lockFile)
        if (descriptor.schemaVersion != 1 || lock.schemaVersion != 1 || lock.architecture != "aarch64") {
            throw new GradleException("Agent Fleet embedded runtime metadata is unsupported")
        }
        if (fileSha256(lockFile) != descriptor.packageLock.sha256 || lockFile.length() != descriptor.packageLock.size) {
            throw new GradleException("Agent Fleet package lock does not match embedded-runtime-v1")
        }
        delete(agentFleetGeneratedAssets)
        agentFleetGeneratedAssets.mkdirs()
        copy {
            from agentFleetRuntimeSource
            into agentFleetGeneratedAssets
        }
        def packageOutput = new File(agentFleetGeneratedAssets, "packages")
        packageOutput.mkdirs()
        agentFleetPackageCache.mkdirs()
        lock.packages.each { item ->
            if (!(item.name instanceof String) || !(item.file instanceof String) || !(item.url instanceof String) ||
                !(item.sha256 ==~ /^[a-f0-9]{64}$/) || !(item.size instanceof Number)) {
                throw new GradleException("Agent Fleet package lock contains an invalid record")
            }
            def cached = new File(agentFleetPackageCache, item.file)
            if (!cached.isFile() || cached.length() != item.size || fileSha256(cached) != item.sha256) {
                cached.delete()
                def temporary = new File(agentFleetPackageCache, ".${item.file}.${UUID.randomUUID()}")
                logger.lifecycle("Downloading locked Termux package ${item.name} ${item.version}")
                try {
                    new URL(item.url).withInputStream { input ->
                        temporary.withOutputStream { output -> output << input }
                    }
                    if (temporary.length() != item.size || fileSha256(temporary) != item.sha256) {
                        throw new GradleException("Locked Termux package failed verification: ${item.name}")
                    }
                    java.nio.file.Files.move(
                        temporary.toPath(), cached.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE
                    )
                } finally {
                    temporary.delete()
                }
            }
            java.nio.file.Files.copy(
                cached.toPath(), new File(packageOutput, item.file).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }
    }
}

preBuild.dependsOn(prepareAgentFleetRuntimeAssets)

